; -----------------------------------------------------------------------------
; Vela configuration file for Ambiq Ethos-U85 targets.
;
; System configs model the NPU clock tiers (ULP 100 MHz, LP 250 MHz,
; HP 500 MHz) against the fixed 250 MHz SRAM/AXI memory fabric. Latencies
; are expressed in NPU core-clock cycles, so they scale with the tier to
; keep the same wall-clock latency. Axi0 is the shared SRAM; Axi1 models
; the read-only const store (MRAM) as SRAM-backed.
;
; These numbers drive Vela's scheduling and static performance estimates
; only — measured performance comes from profiling on the target.

; -----------------------------------------------------------------------------
; System Configuration

; NPU 100 MHz (ULP) against the 250 MHz fabric.
[System_Config.Ambiq_ULP_SRAM]
core_clock=100e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=2.5
Sram_ports_used=2
Sram_burst_length=128
Sram_read_latency=5
Sram_write_latency=5
Sram_max_reads=8
Sram_max_writes=8
Dram_clock_scale=2.5
Dram_ports_used=2
Dram_burst_length=128
Dram_read_latency=5
Dram_write_latency=5
Dram_max_reads=8
Dram_max_writes=8

; NPU 250 MHz (LP), matched to the 250 MHz fabric.
[System_Config.Ambiq_LP_SRAM]
core_clock=250e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=1.0
Sram_ports_used=2
Sram_burst_length=128
Sram_read_latency=12
Sram_write_latency=12
Sram_max_reads=8
Sram_max_writes=8
Dram_clock_scale=1.0
Dram_ports_used=2
Dram_burst_length=128
Dram_read_latency=12
Dram_write_latency=12
Dram_max_reads=8
Dram_max_writes=8

; NPU 500 MHz (HP) against the 250 MHz fabric.
[System_Config.Ambiq_HP_SRAM]
core_clock=500e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=0.5
Sram_ports_used=2
Sram_burst_length=128
Sram_read_latency=25
Sram_write_latency=25
Sram_max_reads=8
Sram_max_writes=8
Dram_clock_scale=0.5
Dram_ports_used=2
Dram_burst_length=128
Dram_read_latency=25
Dram_write_latency=25
Dram_max_reads=8
Dram_max_writes=8

; -----------------------------------------------------------------------------
; Memory Mode

; SRAM Only: one memory area is used for all storage.
[Memory_Mode.Sram_Only]
const_mem_area=Axi0
arena_mem_area=Axi0
cache_mem_area=Axi0

; Shared SRAM: weights/consts live in the read-only Axi1 area (MRAM);
; the tensor arena lives in SRAM, shared with the Cortex-M software.
[Memory_Mode.Shared_Sram]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0
