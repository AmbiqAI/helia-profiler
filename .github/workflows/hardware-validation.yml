name: Hardware Validation

on:
  schedule:
    # 09:00 UTC nightly (01:00 PDT / 00:00 PST).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Validation suite preset"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - models-rt
          - models-aot
          - complete
      boards:
        description: "Comma-separated board IDs"
        required: true
        default: apollo510_evb,apollo330mP_evb
        type: string
      models:
        description: "Optional comma-separated model IDs; empty uses suite defaults"
        required: false
        default: ""
        type: string
      engines:
        description: "Optional comma-separated engines: helia-rt,helia-aot,tflm,executorch; empty uses suite defaults"
        required: false
        default: ""
        type: string
      executorch_backends:
        description: "ExecuTorch CMSIS-NN provider selection"
        required: true
        default: both
        type: choice
        options:
          - both
          - arm
          - ns
      ns_cmsis_nn_ref:
        description: "Optional ns-cmsis-nn branch name or full 40-character commit SHA (empty uses the HPX qualified baseline)"
        required: false
        default: ""
        type: string
      toolchains:
        description: "Optional comma-separated toolchains: arm-none-eabi-gcc,armclang,atfe; empty uses suite defaults"
        required: false
        default: ""
        type: string
      atfe_root:
        description: "Optional ATFE_ROOT path; falls back to repository/environment variable ATFE_ROOT"
        required: false
        default: ""
        type: string
      transports:
        description: "Optional comma-separated transports: rtt,uart,swo,usb_cdc; empty uses suite defaults"
        required: false
        default: ""
        type: string
      memories:
        description: "Optional comma-separated memory placements: auto,tcm,sram,mram,psram; empty uses suite defaults"
        required: false
        default: ""
        type: string
      power:
        description: "Power validation mode"
        required: true
        default: "on"
        type: choice
        options:
          - "off"
          - "on"
          - "both"
      power_boards:
        description: "Comma-separated boards allowed to use power capture"
        required: false
        default: "apollo510_evb"
        type: string
      jlink_serials:
        description: "Optional comma-separated board=serial entries"
        required: false
        default: "apollo510_evb=1160003180,apollo330mP_evb=1160003409"
        type: string
      power_serials:
        description: "Optional comma-separated board=Joulescope-serial entries"
        required: false
        default: "apollo510_evb=H8MS"
        type: string
      repeat:
        description: "Repeat each selected case N times"
        required: true
        default: "1"
        type: string
      timeout:
        description: "Per-case timeout in seconds"
        required: true
        default: "900"
        type: string

defaults:
  run:
    shell: bash

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.uv-python
  # hpx persistent caches (incremental firmware workspaces, engine downloads).
  # The runner's service home is read-only (NixOS-managed), so ~/.cache is not
  # an option; the checkout parent directory is writable and survives both the
  # checkout action's git clean and runs, so warm nightlies reuse the
  # configured build trees instead of cold-building every case.
  HPX_CACHE_DIR: ${{ github.workspace }}/../hpx-cache
  SEGGER_RTT_PATH: ${{ github.workspace }}/segger-rtt
  HPX_NSX_EXECUTORCH_REF: 27eee513636821398f0bb5e92055526cac29b1ed
  HPX_QUALIFIED_NS_CMSIS_NN_REF: 631726420b04860a5c4236956a3741ff5a96bd7f
  # Scheduled runs have no workflow_dispatch inputs. Keep those runs aligned
  # with the manual defaults, except that nightly validation covers the full suite.
  HPX_VALIDATION_SUITE: ${{ inputs.suite || 'complete' }}
  HPX_VALIDATION_BOARDS: ${{ inputs.boards || 'apollo510_evb,apollo330mP_evb' }}
  HPX_VALIDATION_MODELS: ${{ inputs.models || '' }}
  HPX_VALIDATION_ENGINES: ${{ inputs.engines || '' }}
  HPX_VALIDATION_EXECUTORCH_BACKENDS: ${{ inputs.executorch_backends || 'both' }}
  HPX_NS_CMSIS_NN_REF: ${{ inputs.ns_cmsis_nn_ref || '' }}
  HPX_VALIDATION_TOOLCHAINS: ${{ inputs.toolchains || '' }}
  HPX_VALIDATION_TRANSPORTS: ${{ inputs.transports || '' }}
  HPX_VALIDATION_MEMORIES: ${{ inputs.memories || '' }}
  HPX_VALIDATION_POWER: ${{ inputs.power || 'on' }}
  HPX_VALIDATION_POWER_BOARDS: ${{ inputs.power_boards || 'apollo510_evb' }}
  HPX_VALIDATION_JLINK_SERIALS: ${{ inputs.jlink_serials || 'apollo510_evb=1160003180,apollo330mP_evb=1160003409' }}
  HPX_VALIDATION_POWER_SERIALS: ${{ inputs.power_serials || 'apollo510_evb=H8MS' }}
  HPX_VALIDATION_RUN_ORIGIN: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
  HPX_VALIDATION_REPEAT: ${{ inputs.repeat || '1' }}
  HPX_VALIDATION_TIMEOUT: ${{ inputs.timeout || '900' }}

concurrency:
  group: hardware-validation-${{ inputs.boards || 'apollo510_evb,apollo330mP_evb' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, hpx-hardware]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install validation dependencies
        run: uv sync --locked --python 3.11 --group test --extra aot

      - name: Fetch LFS fixtures
        run: git lfs pull

      - name: Resolve ns-cmsis-nn source
        id: resolve_ns_cmsis_nn
        run: |
          checkout_root="$(mktemp -d "${RUNNER_TEMP}/hpx-ns-cmsis-nn.XXXXXX")"
          checkout_path="${checkout_root}/ns-cmsis-nn"

          requested_ref="${HPX_NS_CMSIS_NN_REF}"

          if [[ -z "${requested_ref}" ]]; then
            requested_ref="${HPX_QUALIFIED_NS_CMSIS_NN_REF}"
            requested_kind="qualified_baseline"
          elif [[ "${requested_ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            requested_kind="commit"
          else
            if [[ "${requested_ref}" =~ ^([[:alnum:]-]+-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || ! git check-ref-format --branch "${requested_ref}" > /dev/null; then
              echo "ns_cmsis_nn_ref must be a branch name or a full 40-character commit SHA; release version/tag names are not accepted." >&2
              exit 2
            fi
            requested_kind="branch"
          fi

          git clone --filter=blob:none --no-checkout https://github.com/AmbiqAI/ns-cmsis-nn.git "${checkout_path}"
          if [[ "${requested_kind}" == "branch" ]]; then
            git -C "${checkout_path}" fetch --depth 1 origin "refs/heads/${requested_ref}"
          else
            git -C "${checkout_path}" fetch --depth 1 origin "${requested_ref}"
          fi
          git -C "${checkout_path}" checkout --detach FETCH_HEAD

          resolved_commit="$(git -C "${checkout_path}" rev-parse HEAD)"
          if [[ "${requested_kind}" != "branch" && "${resolved_commit}" != "${requested_ref,,}" ]]; then
            echo "Resolved ns-cmsis-nn commit does not match the requested commit." >&2
            exit 2
          fi
          echo "NS_CMSIS_NN_RESOLVED_COMMIT=${resolved_commit}" >> "${GITHUB_ENV}"
          echo "NS_CMSIS_NN_REQUESTED_KIND=${requested_kind}" >> "${GITHUB_ENV}"
          echo "NS_CMSIS_NN_REQUESTED_REF=${requested_ref}" >> "${GITHUB_ENV}"
          echo "resolved_commit=${resolved_commit}" >> "${GITHUB_OUTPUT}"
          echo "HPX_SOURCE_REVISIONS_JSON={\"ns-cmsis-nn\":{\"requested_kind\":\"${requested_kind}\",\"requested_ref\":\"${requested_ref}\",\"resolved_commit\":\"${resolved_commit}\"}}" \
            >> "${GITHUB_ENV}"

          mkdir -p results/validation
          {
            echo "requested_kind=${requested_kind}"
            echo "requested_ref=${requested_ref}"
            echo "resolved_commit=${resolved_commit}"
          } > results/validation/ns-cmsis-nn-revision.txt

          {
            echo "### ns-cmsis-nn"
            echo ""
            echo "- Requested ${requested_kind}: \`${requested_ref}\`"
            echo "- Resolved commit: \`${resolved_commit}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout qualified nsx-executorch
        uses: actions/checkout@v4
        if: >-
          contains(env.HPX_VALIDATION_ENGINES, 'executorch') ||
          contains(env.HPX_VALIDATION_ENGINES, 'et') ||
          (env.HPX_VALIDATION_SUITE == 'complete' && env.HPX_VALIDATION_ENGINES == '')
        with:
          repository: AmbiqAI/nsx-executorch
          ref: ${{ env.HPX_NSX_EXECUTORCH_REF }}
          path: .dependencies/nsx-executorch
          token: ${{ secrets.NSX_EXECUTORCH_TOKEN || github.token }}
          fetch-depth: 1

      - name: Initialize qualified ExecuTorch dependencies
        if: >-
          contains(env.HPX_VALIDATION_ENGINES, 'executorch') ||
          contains(env.HPX_VALIDATION_ENGINES, 'et') ||
          (env.HPX_VALIDATION_SUITE == 'complete' && env.HPX_VALIDATION_ENGINES == '')
        run: |
          checkout_path="${GITHUB_WORKSPACE}/.dependencies/nsx-executorch"

          git -C "${checkout_path}" submodule update --init --depth 1 external/executorch
          git -C "${checkout_path}/external/executorch" submodule update --init --depth 1 \
            backends/xnnpack/third-party/FXdiv \
            third-party/flatbuffers \
            third-party/flatcc \
            third-party/gflags \
            third-party/json

          resolved_commit="$(git -C "${checkout_path}" rev-parse HEAD)"
          executorch_commit="$(git -C "${checkout_path}/external/executorch" rev-parse HEAD)"
          if [[ "${resolved_commit}" != "${HPX_NSX_EXECUTORCH_REF}" ]]; then
            echo "Resolved nsx-executorch commit does not match the qualified commit." >&2
            exit 2
          fi
          if [[ "${executorch_commit}" != "3a97429b0ce0c192861fc3e3729fb81432fd22cf" ]]; then
            echo "Resolved ExecuTorch submodule does not match the qualified commit." >&2
            exit 2
          fi

          echo "NSX_EXECUTORCH_ROOT=${checkout_path}" >> "${GITHUB_ENV}"
          echo "HPX_SOURCE_REVISIONS_JSON={\"ns-cmsis-nn\":{\"requested_kind\":\"${NS_CMSIS_NN_REQUESTED_KIND}\",\"requested_ref\":\"${NS_CMSIS_NN_REQUESTED_REF}\",\"resolved_commit\":\"${NS_CMSIS_NN_RESOLVED_COMMIT}\"},\"nsx-executorch\":{\"requested_kind\":\"commit\",\"requested_ref\":\"${HPX_NSX_EXECUTORCH_REF}\",\"resolved_commit\":\"${resolved_commit}\"},\"executorch\":{\"requested_kind\":\"commit\",\"requested_ref\":\"${executorch_commit}\",\"resolved_commit\":\"${executorch_commit}\"},\"arm-cmsis-nn\":{\"requested_kind\":\"commit\",\"requested_ref\":\"6d21a6f821fb72541173a6c4d05d83329fa74f7c\",\"resolved_commit\":\"6d21a6f821fb72541173a6c4d05d83329fa74f7c\"}}" \
            >> "${GITHUB_ENV}"
          {
            echo "nsx-executorch=${resolved_commit}"
            echo "executorch=${executorch_commit}"
          } > results/validation/executorch-revisions.txt

          {
            echo ""
            echo "### ExecuTorch"
            echo ""
            echo "- nsx-executorch: \`${resolved_commit}\`"
            echo "- ExecuTorch: \`${executorch_commit}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fetch SEGGER RTT sources
        run: |
          if [[ ! -f "${SEGGER_RTT_PATH}/RTT/SEGGER_RTT.c" || ! -f "${SEGGER_RTT_PATH}/RTT/SEGGER_RTT.h" || ! -f "${SEGGER_RTT_PATH}/Config/SEGGER_RTT_Conf.h" ]]; then
            rm -rf "${SEGGER_RTT_PATH}"
            git clone --depth 1 https://github.com/SEGGERMicro/RTT.git "${SEGGER_RTT_PATH}"
          fi

      - name: Configure ATFE_ROOT override
        env:
          HPX_ATFE_ROOT_OVERRIDE: ${{ inputs.atfe_root || vars.ATFE_ROOT }}
        run: |
          if [[ -n "${HPX_ATFE_ROOT_OVERRIDE}" ]]; then
            echo "ATFE_ROOT=${HPX_ATFE_ROOT_OVERRIDE}" >> "${GITHUB_ENV}"
          fi

      - name: Check host dependencies
        run: uv run hpx doctor

      - name: Preview validation cases
        run: |
          args=(
            --list
            --suite "${HPX_VALIDATION_SUITE}"
            --boards "${HPX_VALIDATION_BOARDS}"
            --power "${HPX_VALIDATION_POWER}"
            --repeat "${HPX_VALIDATION_REPEAT}"
            --timeout "${HPX_VALIDATION_TIMEOUT}"
            --executorch-backends "${HPX_VALIDATION_EXECUTORCH_BACKENDS}"
            --ns-cmsis-nn-ref "${{ steps.resolve_ns_cmsis_nn.outputs.resolved_commit }}"
          )
          if [[ -n "${HPX_VALIDATION_MODELS}" ]]; then
            args+=(--models "${HPX_VALIDATION_MODELS}")
          fi
          if [[ -n "${HPX_VALIDATION_ENGINES}" ]]; then
            args+=(--engines "${HPX_VALIDATION_ENGINES}")
          fi
          if [[ -n "${HPX_VALIDATION_TOOLCHAINS}" ]]; then
            args+=(--toolchains "${HPX_VALIDATION_TOOLCHAINS}")
          fi
          if [[ -n "${HPX_VALIDATION_TRANSPORTS}" ]]; then
            args+=(--transports "${HPX_VALIDATION_TRANSPORTS}")
          fi
          if [[ -n "${HPX_VALIDATION_MEMORIES}" ]]; then
            args+=(--memories "${HPX_VALIDATION_MEMORIES}")
          fi
          if [[ -n "${HPX_VALIDATION_POWER_BOARDS}" ]]; then
            args+=(--power-boards "${HPX_VALIDATION_POWER_BOARDS}")
          fi
          if [[ -n "${HPX_VALIDATION_JLINK_SERIALS}" ]]; then
            args+=(--jlink-serials "${HPX_VALIDATION_JLINK_SERIALS}")
          fi
          if [[ -n "${HPX_VALIDATION_POWER_SERIALS}" ]]; then
            args+=(--power-serials "${HPX_VALIDATION_POWER_SERIALS}")
          fi
          uv run hpx validate "${args[@]}"

      - name: Run hardware validation
        run: |
          mkdir -p results/validation
          args=(
            --suite "${HPX_VALIDATION_SUITE}"
            --boards "${HPX_VALIDATION_BOARDS}"
            --power "${HPX_VALIDATION_POWER}"
            --repeat "${HPX_VALIDATION_REPEAT}"
            --timeout "${HPX_VALIDATION_TIMEOUT}"
            --executorch-backends "${HPX_VALIDATION_EXECUTORCH_BACKENDS}"
            --ns-cmsis-nn-ref "${{ steps.resolve_ns_cmsis_nn.outputs.resolved_commit }}"
            --output-dir results/validation
            --junit-xml results/validation/junit.xml
          )
          if [[ -n "${HPX_VALIDATION_MODELS}" ]]; then
            args+=(--models "${HPX_VALIDATION_MODELS}")
          fi
          if [[ -n "${HPX_VALIDATION_ENGINES}" ]]; then
            args+=(--engines "${HPX_VALIDATION_ENGINES}")
          fi
          if [[ -n "${HPX_VALIDATION_TOOLCHAINS}" ]]; then
            args+=(--toolchains "${HPX_VALIDATION_TOOLCHAINS}")
          fi
          if [[ -n "${HPX_VALIDATION_TRANSPORTS}" ]]; then
            args+=(--transports "${HPX_VALIDATION_TRANSPORTS}")
          fi
          if [[ -n "${HPX_VALIDATION_MEMORIES}" ]]; then
            args+=(--memories "${HPX_VALIDATION_MEMORIES}")
          fi
          if [[ -n "${HPX_VALIDATION_POWER_BOARDS}" ]]; then
            args+=(--power-boards "${HPX_VALIDATION_POWER_BOARDS}")
          fi
          if [[ -n "${HPX_VALIDATION_JLINK_SERIALS}" ]]; then
            args+=(--jlink-serials "${HPX_VALIDATION_JLINK_SERIALS}")
          fi
          if [[ -n "${HPX_VALIDATION_POWER_SERIALS}" ]]; then
            args+=(--power-serials "${HPX_VALIDATION_POWER_SERIALS}")
          fi
          uv run hpx validate "${args[@]}"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-validation-${{ github.run_id }}
          path: |
            results/validation/
            !results/validation/**/work/**
          if-no-files-found: warn
