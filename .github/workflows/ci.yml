name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------
  # Lint — runs once on Linux
  # ---------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure GitHub auth (higher API rate limits)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      # The aot/analysis extras and the test group are needed by ty, not
      # ruff: the type-check environment must contain every dependency the
      # source can resolve (helia_aot.*, ai_edge_litert, the lazy pytest
      # import in validate_cmd), or ty reports unresolved-import for guarded
      # optional imports that are healthy at runtime.
      - name: Install lint dependencies
        run: uv sync --locked --group lint --group test --extra aot --extra analysis

      - name: Run ruff lint
        run: uv run --no-sync ruff check .

      # Type checking gates src only for now; the tests tree is follow-up
      # work tracked on #199. ty is pinned exactly in the lint group -- it is
      # pre-1.0 and upgrades are deliberate, with a diagnostic re-triage.
      # --no-sync: the environment was fully built by the sync step above;
      # skipping the implicit re-resolve keeps this step honest about that.
      - name: Run ty type check
        run: uv run --no-sync ty check src/helia_profiler

  # ---------------------------------------------------------------
  # Unit tests — run on all three platforms
  # ---------------------------------------------------------------
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure GitHub auth (higher API rate limits)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install test dependencies
        run: uv sync --locked --group test

      - name: Run pytest
        run: uv run --group test pytest tests/ -q

  # ---------------------------------------------------------------
  # Analysis extra — the tests that need ai-edge-litert.
  #
  # The unit-test matrix deliberately installs no extras, so the litert
  # cross-validation of the minimal flatbuffer reader (#57) skipped in every
  # job and the reader shipped with its differential oracle disconnected
  # (found by review of #143). One cell, one Python: the sweep is
  # environment-independent and the matrix already covers the interpreters.
  # ---------------------------------------------------------------
  analysis-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install test dependencies with the analysis and aot extras
        # aot joins analysis here for the #147 boundary tripwire: the softmax
        # preflight mirrors helia-aot internals by hand, and the sweep that
        # guards them needs the real compiler installed.
        run: uv sync --locked --group test --extra analysis --extra aot

      - name: Fail loudly if litert or helia-aot is absent
        # Without this the job goes green with every litert and helia-aot
        # test skipped -- the exact disconnected-oracle failure it exists to
        # prevent.
        run: |
          uv run --group test --extra analysis --extra aot python \
            -c "import ai_edge_litert.schema_py_generated; import helia_aot"

      - name: Run the litert- and helia-aot-dependent tests
        run: |
          uv run --group test --extra analysis --extra aot pytest \
            tests/test_softmax_preflight.py tests/test_model_analysis.py \
            tests/test_example_models.py -q

  # ---------------------------------------------------------------
  # Package — validate the exact wheel/sdist release boundaries
  # ---------------------------------------------------------------
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build and validate distributions
        run: |
          uv python install 3.11 3.12 3.13 3.14
          uv build --out-dir dist
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          source_version=$(python3 -c 'import runpy; print(runpy.run_path("src/helia_profiler/_version.py")["__version__"])')
          lock_version=$(python3 -c 'import tomllib; data = tomllib.load(open("uv.lock", "rb")); print(next(p["version"] for p in data["package"] if p["name"] == "helia-profiler"))')
          if [[ "${source_version}" != "${package_version}" ]]; then
            echo "Source version ${source_version} does not match package version ${package_version}."
            exit 1
          fi
          if [[ "${lock_version}" != "${package_version}" ]]; then
            echo "Lockfile version ${lock_version} does not match package version ${package_version}."
            exit 1
          fi
          if [[ "$(grep -c 'x-release-please-version' uv.lock)" -ne 1 ]]; then
            echo "uv.lock must contain exactly one Release Please version marker."
            exit 1
          fi
          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"
          python3 tools/verify_distribution.py \
            dist --expected-version "${package_version}"

      - name: Clean-install wheel and sdist
        run: |
          smoke_install() {
            python_version="$1"
            distribution="$2"
            package="$3"
            environment=".release-${python_version}-${distribution}"
            uv venv --python "${python_version}" "${environment}"
            uv pip install --python "${environment}/bin/python" "${package}"
            "${environment}/bin/hpx" --version | grep -F "hpx ${PACKAGE_VERSION}"
            env -u SEGGER_RTT_PATH "${environment}/bin/python" -c \
              'from helia_profiler.firmware import _find_segger_rtt_dir; assert _find_segger_rtt_dir().name == "segger_rtt"'
          }

          wheel=(dist/*.whl)
          sdist=(dist/*.tar.gz)
          if [[ "${#wheel[@]}" -ne 1 || "${#sdist[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel and one sdist."
            exit 1
          fi
          for python_version in 3.11 3.12 3.13 3.14; do
            smoke_install "${python_version}" wheel "${wheel[0]}"
            smoke_install "${python_version}" sdist "${sdist[0]}"
          done

  # ---------------------------------------------------------------
  # Gate — single required-check for branch protection
  # ---------------------------------------------------------------
  lint-and-test:
    if: always()
    needs: [lint, unit-tests, analysis-tests, package]
    runs-on: ubuntu-latest
    steps:
      - name: Decide status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] ||
             [[ "${{ needs.unit-tests.result }}" != "success" ]] ||
             [[ "${{ needs.analysis-tests.result }}" != "success" ]] ||
             [[ "${{ needs.package.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
