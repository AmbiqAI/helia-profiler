name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  nix-evaluation:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Evaluate locked flake on all supported systems
        run: >-
          nix --extra-experimental-features 'nix-command flakes'
          flake check --no-build --all-systems --no-update-lock-file

  # ---------------------------------------------------------------
  # Type check — runs once on Linux. ruff runs in the pre-commit job, at
  # the version uv.lock resolves.
  # ---------------------------------------------------------------
  typecheck:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update Python certificate tooling
        run: uv pip install --system --python python 'pip>=26.2.2'

      - name: Configure GitHub auth (higher API rate limits)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      # The aot/analysis extras and the test group are needed by ty: the
      # type-check environment must contain every dependency the
      # source can resolve (helia_aot.*, ai_edge_litert, the lazy pytest
      # import in validate_cmd), or ty reports unresolved-import for guarded
      # optional imports that are healthy at runtime.
      - name: Install type-check dependencies
        run: uv sync --locked --group lint --group test --extra aot --extra analysis

      # Type checking gates src AND tests (#199/#201). ty is pinned exactly
      # in the lint group -- it is pre-1.0 and upgrades are deliberate, with
      # a diagnostic re-triage.
      # --no-sync: the environment was fully built by the sync step above;
      # skipping the implicit re-resolve keeps this step honest about that.
      - name: Run ty type check
        run: uv run --no-sync ty check src/helia_profiler tests

  # ---------------------------------------------------------------
  # Unit tests — run on all three platforms
  # ---------------------------------------------------------------
  unit-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Update Python certificate tooling
        run: uv pip install --system --python python 'pip>=26.2.2'

      - name: Configure GitHub auth (higher API rate limits)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install test dependencies
        run: uv sync --locked --group test

      - name: Run pytest
        run: uv run --group test pytest -q

  # ---------------------------------------------------------------
  # Extras — the suite again with ai-edge-litert and helia-aot installed.
  #
  # The unit-test matrix deliberately installs no extras, so the litert
  # cross-validation of the minimal flatbuffer reader (#57) skipped in every
  # job and the reader shipped with its differential oracle disconnected
  # (found by review of #143). One cell, one Python: the sweep is
  # environment-independent and the matrix already covers the interpreters.
  # ---------------------------------------------------------------
  analysis-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install test dependencies with the analysis and aot extras
        # aot joins analysis here for the #147 boundary tripwire: the softmax
        # preflight mirrors helia-aot internals by hand, and the sweep that
        # guards them needs the real compiler installed.
        run: uv sync --locked --group test --extra analysis --extra aot

      - name: Fail loudly if litert or helia-aot is absent
        # Without this the job goes green with every litert and helia-aot
        # test skipped -- the exact disconnected-oracle failure it exists to
        # prevent.
        run: |
          uv run --group test --extra analysis --extra aot python \
            -c "import ai_edge_litert.schema_py_generated; import helia_aot"

      # The whole suite, not a list of the files known to need the extras:
      # a hand list silently missed every new importorskip test.
      - name: Run the suite with the extras installed
        run: uv run --group test --extra analysis --extra aot pytest -q

  # ---------------------------------------------------------------
  # pre-commit — runs the exact hook config contributors run locally, so
  # a hook that only exists in someone's local install can't go unnoticed.
  # ---------------------------------------------------------------
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update Python certificate tooling
        run: uv pip install --system --python python 'pip>=26.2.2'

      # Pinned to the same version contributors are told to install in
      # README.md -- a drifted local/CI pre-commit version is exactly the
      # kind of disagreement this job exists to prevent.
      - name: Install pre-commit
        run: |
          uv tool install --with virtualenv==21.14.13 pre-commit==4.6.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-trust-20261019-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # ---------------------------------------------------------------
  # Package — validate the exact wheel/sdist release boundaries
  # ---------------------------------------------------------------
  package:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Build and validate distributions
        run: |
          uv python install 3.11 3.12 3.13 3.14
          uv build --out-dir dist
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          source_version=$(python3 -c 'import runpy; print(runpy.run_path("src/helia_profiler/_version.py")["__version__"])')
          lock_version=$(python3 -c 'import tomllib; data = tomllib.load(open("uv.lock", "rb")); print(next(p["version"] for p in data["package"] if p["name"] == "helia-profiler"))')
          if [[ "${source_version}" != "${package_version}" ]]; then
            echo "Source version ${source_version} does not match package version ${package_version}."
            exit 1
          fi
          if [[ "${lock_version}" != "${package_version}" ]]; then
            echo "Lockfile version ${lock_version} does not match package version ${package_version}."
            exit 1
          fi
          if [[ "$(grep -c 'x-release-please-version' uv.lock)" -ne 1 ]]; then
            echo "uv.lock must contain exactly one Release Please version marker."
            exit 1
          fi
          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"
          python3 tools/verify_distribution.py \
            dist --expected-version "${package_version}"

      - name: Clean-install wheel and sdist
        run: |
          smoke_install() {
            python_version="$1"
            distribution="$2"
            package="$3"
            environment=".release-${python_version}-${distribution}"
            uv venv --python "${python_version}" "${environment}"
            uv pip install --python "${environment}/bin/python" "${package}"
            "${environment}/bin/hpx" --version | grep -F "hpx ${PACKAGE_VERSION}"
            "${environment}/bin/python" -c \
              'from helia_profiler.deps.compatibility import load_compatibility_baseline; b = load_compatibility_baseline(); assert b.module("nsx-segger-rtt").ref == b.project("nsx-segger-rtt").ref'
          }

          wheel=(dist/*.whl)
          sdist=(dist/*.tar.gz)
          if [[ "${#wheel[@]}" -ne 1 || "${#sdist[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel and one sdist."
            exit 1
          fi
          for python_version in 3.11 3.12 3.13 3.14; do
            smoke_install "${python_version}" wheel "${wheel[0]}"
            smoke_install "${python_version}" sdist "${sdist[0]}"
          done

  # ---------------------------------------------------------------
  # Gate — single required-check for branch protection
  # ---------------------------------------------------------------
  lint-and-test:
    if: always()
    needs: [nix-evaluation, typecheck, unit-tests, analysis-tests, pre-commit, package]
    runs-on: ubuntu-latest
    steps:
      - name: Decide status
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            [[ "${{ needs.pre-commit.result }}" == "success" ]] || exit 1
            exit 0
          fi
          if [[ "${{ needs.nix-evaluation.result }}" != "success" ]] ||
             [[ "${{ needs.typecheck.result }}" != "success" ]] ||
             [[ "${{ needs.unit-tests.result }}" != "success" ]] ||
             [[ "${{ needs.analysis-tests.result }}" != "success" ]] ||
             [[ "${{ needs.pre-commit.result }}" != "success" ]] ||
             [[ "${{ needs.package.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
