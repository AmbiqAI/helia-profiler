[project]
name = "helia-profiler"
version = "0.4.1"
description = "Profile LiteRT and ExecuTorch models on Ambiq Apollo hardware"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]
keywords = ["ambiq", "apollo", "embedded", "joulescope", "litert", "profiling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "certifi>=2026.10.19",
    "urllib3>=2.8.0",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "rich>=13.0",
    "pyserial>=3.5",
    "pylink-square>=0.14.0",
    "neuralspotx==0.9.0",
    "numpy>=2.1,<3",
    "pyjoulescope-driver>=2.2.12,<2.3.0; python_version < '3.12'",
    "pyjoulescope-driver>=2.3.4,<3; python_version >= '3.12'",
    "pydantic>=2.7,<3",
    "typer>=0.16",
    "click>=8.2",
]

[project.optional-dependencies]
aot = [
    "helia-aot>=0.33.0,<2.0.0",
    "ai-edge-litert>=2.1.6,<2.3",
    "backports-strenum<1.3",
]
analysis = [
    "ai-edge-litert>=2.1.6,<2.3",
    "backports-strenum<1.3",
    "flatbuffers>=24.0",
]

[project.scripts]
hpx = "helia_profiler.cli:main"

[project.urls]
Documentation = "https://ambiqai.github.io/helia-profiler/"
Issues = "https://github.com/AmbiqAI/helia-profiler/issues"
Repository = "https://github.com/AmbiqAI/helia-profiler"

[dependency-groups]
lint = [
    "ruff>=0.11.0,<0.12",
    # Pinned exactly: ty is pre-1.0 and its rule behavior moves between
    # releases -- upgrades are deliberate, with a re-triage of diagnostics.
    "ty==0.0.74",
]
test = ["pytest>=8.0", "pytest-timeout>=2.3", "packaging>=24.0", "jsonschema>=4.23,<5"]
notebook = ["ipykernel>=6,<8"]

[tool.uv]
required-version = ">=0.13.4"
# Resolver floors protect project installs. Runtime trust floors also belong
# in project.dependencies so published wheel consumers receive them.
constraint-dependencies = [
    # GHSA-6q48-6c7w-9gw2: remove the compromised emSign certificate chain.
    "certifi>=2026.10.19",
    # GHSA idna: crafted input bypasses the CVE-2024-3651 fix in idna.encode().
    # Reaches HPX via pyjoulescope-driver -> requests.
    "idna>=3.15",
    # GHSA-8988-9cw3-xx77, GHSA-vxq7-64xx-v4gw, GHSA-gh4c-6fx4-qh6g.
    "urllib3>=2.8.0",
    # GHSA-pcg2-g6cj-q92c, GHSA-pw9p-v7r6-gx4p, GHSA-r4j5-9xpp-3985.
    "tornado>=6.6",
]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["helia_profiler", "helia_profiler.*"]

[tool.setuptools.package-data]
helia_profiler = [
    "firmware/templates/**/*",
    "engines/templates/**/*",
    "data/*.json",
    "data/models/*.json",
    "data/runtimes/*/*.json",
    "data/models/*.tflite",
    "fixture_closure.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/tests"]
addopts = "-m 'not hardware and not compile_hw'"
strict_markers = true
markers = [
    "host_integration: runs real host compilers, Git, packaging, shell scripts or interpreter isolation; no physical devices. Included in ordinary CI.",
    "hardware: requires physical target hardware (EVB + J-Link, optional Joulescope). Excluded by default; run via `hpx validate` or `pytest -m hardware`.",
    "compile_hw: compiles rendered firmware with the real arm-none-eabi toolchain against a warm dependency workspace (#187 Tier 2). No board needed, but skips wherever no workspace is cached; run on the bench via `pytest -m compile_hw`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PLW1514",
]
ignore = [
    "E741",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
