# Tier-1 gcc-vs-ATfE comparison (arm provider) — same PTE as tier1_arm.yaml,
# built with ATfE (requires ATFE_ROOT). Compare with:
#   hpx compare results/tier1_arm results/tier1_arm_atfe
# Provider notes: ARM baseline: sub/leaky_relu/clamp(relu) run as float portable kernels.
# Exported by tools/export/executorch_tier1/export_tier1.py; compare the
# paired arm/ns runs with `hpx compare`.
model:
  path: examples/models/tier1/tier1_arm.pte
  arena_size: 196608
  arena_location: sram
  weights_location: mram

engine:
  type: executorch
  backend: arm
  config:
    # nsx-executorch main @ 62b22f96dc49e2c28eb20aee0f15ebb7ad1c1d59
    source_path: /path/to/nsx-executorch
    method_arena_size: 65536
    temporary_arena_size: 32768
    input_size: 65536
    output_size: 65536
    portable_ops:
      - aten::clamp.out
      - aten::leaky_relu.out
      - aten::sub.out

target:
  board: apollo510_evb
  toolchain: atfe
  transport: rtt
  clock:
    cpu: lp

profiling:
  pmu_counters:
    cpu: default
    mve: default
    memory: default
  per_layer: true
  iterations: 25
  warmup: 5
  aggregation: median

power:
  enabled: false

output:
  format: json
  dir: ./results/tier1_arm_atfe
  model_explorer: false
  detailed: true
