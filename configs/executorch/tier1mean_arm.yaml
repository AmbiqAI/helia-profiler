# Tier-1 quantized_mean micro model — ARM baseline: mean runs as the float portable kernel.
# Exported by tools/export/executorch_tier1/export_tier1.py; compare the
# paired arm/ns runs with `hpx compare`.
model:
  path: examples/models/tier1/tier1mean_arm.pte
  arena_size: 81920
  arena_location: sram
  weights_location: mram

engine:
  type: executorch
  backend: arm
  config:
    # nsx-executorch main @ 62b22f96dc49e2c28eb20aee0f15ebb7ad1c1d59
    source_path: /home/nmysore/nsx-executorch-package
    method_arena_size: 65536
    temporary_arena_size: 32768
    input_size: 65536
    output_size: 64
    portable_ops:
      - aten::mean.out

target:
  board: apollo510_evb
  toolchain: arm-none-eabi-gcc
  transport: rtt
  clock:
    cpu: lp

profiling:
  pmu_counters:
    cpu: default
    mve: default
    memory: default
  per_layer: true
  iterations: 25
  warmup: 5
  aggregation: median

power:
  enabled: false

output:
  format: json
  dir: ./results/tier1mean_arm
  model_explorer: false
  detailed: true
