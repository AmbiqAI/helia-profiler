# Shared-firmware busy-loop power diagnostic.
# Compare gate-window agreement over repeated profile/power boots. Keep
# firmware: shared to exercise the cross-boot path. Results do not establish
# a universal tolerance. Run from the repository root with power wiring ready.
model:
  path: tests/fixtures/mlperf_tiny/kws/kws_ref_model.tflite
  arena_size: 32768
  weights_location: tcm
  arena_location: tcm

engine:
  type: helia-rt

target:
  board: apollo4p_blue_kbr_evb
  toolchain: arm-none-eabi-gcc
  transport: rtt
  clock:
    cpu: lp

profiling:
  pmu_counters:
    cpu: default
  per_layer: true
  clean_window_probe: busy_loop
  iterations: 200
  warmup: 10
  aggregation: median

power:
  enabled: true
  driver: joulescope
  mode: external
  duration_s: 45
  io_voltage: 1.8
  firmware: shared

output:
  format: json
  dir: ./results/bench/busy_loop_shared
  detailed: true
