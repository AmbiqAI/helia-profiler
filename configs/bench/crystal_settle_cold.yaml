# Cold-start clean-timing diagnostic.
# Leave the board unpowered before the session, then run this case first.
# Inspect profile.clean_window_frozen and profile.clean_window_clock_rate_low
# issues alongside clean timing. Run from the repository root.
model:
  path: tests/fixtures/mlperf_tiny/kws/kws_ref_model.tflite
  arena_size: 32768
  weights_location: tcm
  arena_location: tcm

engine:
  type: helia-rt

target:
  board: apollo4p_blue_kbr_evb
  toolchain: arm-none-eabi-gcc
  transport: rtt
  clock:
    cpu: lp

profiling:
  pmu_counters:
    cpu: default
  per_layer: true
  iterations: 200
  warmup: 10
  aggregation: median

power:
  enabled: true
  driver: joulescope
  mode: external
  duration_s: 45
  io_voltage: 1.8
  firmware: shared

output:
  format: json
  dir: ./results/bench/crystal_settle_cold
  detailed: true
