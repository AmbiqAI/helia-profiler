# Shared-firmware inference-window diagnostic.
# Repeat captures to inspect the spread of summary.power.gated_window_duration_ratio
# and recorded issues across profile/power boots. Keep firmware: shared; do not
# derive a new tolerance from one run. Run from the repository root.
model:
  path: tests/fixtures/mlperf_tiny/kws/kws_ref_model.tflite
  arena_size: 32768
  weights_location: tcm
  arena_location: tcm

engine:
  type: helia-rt

target:
  board: apollo4p_blue_kbr_evb
  toolchain: arm-none-eabi-gcc
  transport: rtt
  clock:
    cpu: lp

profiling:
  pmu_counters:
    cpu: default
  per_layer: true
  iterations: 200
  warmup: 10
  aggregation: median

power:
  enabled: true
  driver: joulescope
  mode: external
  duration_s: 45
  io_voltage: 1.8
  firmware: shared

output:
  format: json
  dir: ./results/bench/tolerance_shared_infer
  detailed: true
